{% set name = "domino" %}
{% set version = "0.3.0" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  # nozerorma/DOMINO fork -- modernized dependencies (see setup.py). Two real
  # fixes beyond version bumps, both required for this to actually run, not
  # just install: statsmodels.sandbox.stats.multicomp.fdrcorrection0 was
  # removed from statsmodels entirely (fixed in src/core/domino.py), and
  # Python 3.14 changed the default multiprocessing start method on POSIX
  # from "fork" to "forkserver", breaking every Pool() call site that reads
  # module-level globals set by the parent process (fixed by requesting the
  # "fork" context explicitly at each site).
  # TODO before building: `git tag v{{ version }}` and push it -- this recipe
  # pins a tag that doesn't exist on the remote yet.
  git_url: https://github.com/nozerorma/DOMINO.git
  git_rev: v{{ version }}

build:
  number: 0
  noarch: python
  # --no-build-isolation: this is a plain setup.py package (no pyproject.toml),
  # so pip's default PEP 517 path still tries to build an isolated venv and
  # populate it with setuptools from an index -- but conda-build explicitly
  # blocks index access during the build step. setuptools has to already be
  # in the host env (below) and pip told to use it directly, or the build
  # fails with "Cannot import 'setuptools.build_meta'" (modern conda-forge
  # python packages no longer bundle setuptools the way old ones did).
  script: {{ PYTHON }} -m pip install . --ignore-installed --no-deps --no-build-isolation -vv
  entry_points:
    - domino = src.runner:main_domino
    - slicer = src.runner:main_slicer

requirements:
  host:
    - pip
    - setuptools
    - python >=3.11
  run:
    - python >=3.11
    - networkx >=3.2,<4
    - numpy >=1.26,<3
    - scipy >=1.11,<2
    - pandas >=2.0
    - pcst-fast >=1.0.10
    - statsmodels >=0.14,<1
    - python-louvain >=0.16

test:
  commands:
    - domino --help
    - slicer --help

about:
  home: https://github.com/nozerorma/DOMINO
  license: MIT
  license_family: MIT
  summary: AMI algorithm with low rate of false calls (fork with modernized Python/dependency stack)

extra:
  recipe-maintainers:
    - nozerorma
